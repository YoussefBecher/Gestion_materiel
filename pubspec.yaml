name: gestion_materiel1
description: "Gestion du matériel informatique"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.32.0
  firebase_auth: 4.20.0
  cloud_firestore: ^4.17.5
  geolocator: ^12.0.0
  mobile_scanner: 5.2.3
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.2.2
  network_info_plus: ^6.1.4
  permission_handler: ^13.0.1
  intl: ^0.20.2
  
  flutter_riverpod: ^2.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_biat.png"
  min_sdk_android: 23
flutter:
  uses-material-design: true
  assets:
    - assets/logo_biat.png